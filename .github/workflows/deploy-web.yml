name: Deploy Web Application & API

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build Backend
        run: |
          dotnet restore backend/Invoxa.sln
          dotnet build backend/Invoxa.sln --no-restore -c Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install
          npm run build

      - name: Build Docker Images
        run: |
          docker build -t invoxa-backend:latest -f backend/Dockerfile backend/
          docker build -t invoxa-frontend:latest -f frontend/Dockerfile frontend/

